# Configuração do Servidor Spring
server.port=${PORT:8080}
server.address=0.0.0.0
server.forward-headers-strategy=framework

# Configuração do PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/logitrack_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=4

# Cria as tabelas e a carga de demonstração a partir do SQL do desafio.
# O script é idempotente (IF NOT EXISTS / ON CONFLICT / NOT EXISTS).
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.schema-locations=classpath:db/initial-data.sql
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Supabase Auth project configuration (public URL and publishable key)
supabase.url=${SUPABASE_URL:}
supabase.publishable-key=${SUPABASE_PUBLISHABLE_KEY:}

# Allowed browser origins; in local Docker the Compose default permits localhost.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
