databases:
  - name: logitrack-demo-db
    databaseName: logitrack_db
    user: logitrack_user
    postgresMajorVersion: "15"
    region: ohio
    plan: free

services:
  - type: web
    name: logitrack-api
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./logitrack/backend/Dockerfile
    dockerContext: ./logitrack/backend
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=60.0 -XX:+UseSerialGC -Xss512k"
      - key: DB_SSLMODE
        value: require
      - key: DB_HOST
        fromDatabase:
          name: logitrack-demo-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: logitrack-demo-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: logitrack-demo-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: logitrack-demo-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: logitrack-demo-db
          property: password
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: APP_AUTH_ENABLED
        value: "true"
      - key: APP_CORS_ALLOWED_ORIGINS
        fromService:
          name: logitrack-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    runtime: static
    name: logitrack-web
    buildCommand: cd logitrack/frontend && npm ci && npm run build
    staticPublishPath: logitrack/frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: logitrack-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_DEMO_MODE
        value: "false"
